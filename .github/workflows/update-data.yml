name: Update data

on:
  schedule:
    - cron: "17 * * * *" # every hour
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", ".github/workflows/update-data.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the dashboard logic
        run: node --test tests/*.test.mjs
      - name: Fetch latest numbers, odds and news
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/update-data.mjs
      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
